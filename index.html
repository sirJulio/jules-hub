<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jules Hub</title>
  <meta name="description" content="Julio's online front door: his professional site and his project portal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="title">
      <h1>Jules<span>/</span>Hub</h1>
      <p>Where to find Julio's work online.</p>
    </header>

    <main class="choices">
      <!--
        Each choice is a <div> until its site is online.
        When it goes live, change <div class="choice"> to <a class="choice" href="https://...">,
        change the closing </div> to </a>, and replace the "Opening soon" line with:
          <span>Visit</span><span class="arrow" aria-hidden="true">→</span>
      -->
      <div class="choice">
        <span class="eyebrow">Employers and clients</span>
        <h2>Professional site</h2>
        <p>Background, experience and the work behind it.</p>
        <span class="go"><span class="soon">Opening soon</span></span>
      </div>

      <div class="choice">
        <span class="eyebrow">Invite only</span>
        <h2>Project portal</h2>
        <p>Projects, collaborators and the think tank. Sign-in required.</p>
        <span class="go"><span class="soon">Opening soon</span></span>
      </div>
    </main>

    <footer>Melbourne, Australia</footer>
  </div>
</body>
</html>
